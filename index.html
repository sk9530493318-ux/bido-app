<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bido - Video App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; background: #121212; position: relative; }
    .header { padding: 15px; text-align: center; font-size: 20px; font-weight: bold; background: #1f1f1f; border-bottom: 1px solid #333; }
    .feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .video-card { height: 100%; width: 100%; scroll-snap-align: start; display: flex; flex-direction: column; justify-content: center; position: relative; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .upload-btn { position: absolute; bottom: 20px; right: 20px; background: #ff0050; padding: 12px 20px; border-radius: 30px; font-weight: bold; border: none; color: #fff; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">Bido App</div>
    <div class="feed" id="videoFeed">
      <p style="text-align:center; padding-top: 50px;">Loading videos...</p>
    </div>
    <button class="upload-btn" onclick="alert('Upload feature coming soon!')">+ Upload</button>
  </div>

  <script>
    const SUPABASE_URL = "https://your-supabase-url.supabase.co"; // Replace with your Supabase URL
    const SUPABASE_KEY = "Sb_publishable_f-_CwC9R5oX9yRpk1icdKQ__6x9cfEu";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadVideos() {
      const feed = document.getElementById('videoFeed');
      const { data: videos, error } = await supabase.from('videos').select('*');
      
      if (error || !videos.length) {
        feed.innerHTML = '<p style="text-align:center; padding-top: 50px;">No videos found yet!</p>';
        return;
      }

      feed.innerHTML = videos.map(v => `
        <div class="video-card">
          <video src="${v.url}" controls autoplay loop muted></video>
        </div>
      `).join('');
    }

    loadVideos();
  </script>
</body>
</html>
